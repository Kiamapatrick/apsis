<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a58;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c5282;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f58220;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffb64c;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c9bc1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c9bc1;stop-opacity:0.4" />
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#bg3)"/>
  <!-- Soft glow circles -->
  <circle cx="400" cy="240" r="260" fill="#7c9bc1" fill-opacity="0.04"/>
  <!-- Bar chart -->
  <line x1="200" y1="100" x2="200" y2="360" stroke="#7c9bc1" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="200" y1="360" x2="600" y2="360" stroke="#7c9bc1" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Gridlines -->
  <line x1="200" y1="200" x2="600" y2="200" stroke="#7c9bc1" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="6,4"/>
  <line x1="200" y1="280" x2="600" y2="280" stroke="#7c9bc1" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="6,4"/>
  <!-- Bars -->
  <rect x="230" y="200" width="50" height="160" rx="4" fill="url(#bar2)"/>
  <rect x="310" y="150" width="50" height="210" rx="4" fill="url(#bar1)"/>
  <rect x="390" y="170" width="50" height="190" rx="4" fill="url(#bar2)"/>
  <rect x="470" y="120" width="50" height="240" rx="4" fill="url(#bar1)"/>
  <!-- Percentage labels on bars -->
  <text x="255" y="194" font-family="Arial, sans-serif" font-size="13" fill="#7c9bc1" text-anchor="middle" font-weight="600">30%</text>
  <text x="335" y="144" font-family="Arial, sans-serif" font-size="13" fill="#f58220" text-anchor="middle" font-weight="600">16%</text>
  <text x="415" y="164" font-family="Arial, sans-serif" font-size="13" fill="#7c9bc1" text-anchor="middle" font-weight="600">VAT</text>
  <text x="495" y="114" font-family="Arial, sans-serif" font-size="13" fill="#f58220" text-anchor="middle" font-weight="600">PAYE</text>
  <!-- KES Symbol -->
  <text x="640" y="200" font-family="Georgia, serif" font-size="72" fill="#f58220" fill-opacity="0.15" text-anchor="middle" font-weight="bold">KES</text>
  <!-- Label -->
  <rect x="0" y="390" width="800" height="90" fill="#000000" fill-opacity="0.25"/>
  <text x="400" y="435" font-family="Georgia, serif" font-size="22" fill="#ffffff" fill-opacity="0.9" text-anchor="middle" font-weight="bold">Business Taxes in Kenya</text>
  <text x="400" y="462" font-family="Arial, sans-serif" font-size="14" fill="#7c9bc1" text-anchor="middle">Tax Advisory</text>
</svg>
